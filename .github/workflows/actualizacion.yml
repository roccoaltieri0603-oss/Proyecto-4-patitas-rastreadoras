name: Actualización programada

# Llena solo el historial satelital y climático de los lotes, para que las
# series tengan más de una fecha sin depender de que alguien abra la aplicación
# y apriete un botón. Sólo persiste datos reales: un error o un "sin datos" no
# escribe nada. Ver docs/DEPLOYMENT.md.

on:
  schedule:
    # 09:20 UTC ≈ 06:20 en Argentina, una vez por día. El clima cubre hasta
    # 160 lotes; satélite conserva 40 por corrida, cerca de la revisita de S2.
    - cron: '20 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: actualizacion-programada
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      # La falta de secretos es un error visible, nunca una corrida exitosa vacía.
      - name: Verificar configuración
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$AUTH_JWT_SECRET" ]; then
            echo "::error::Faltan DATABASE_URL y/o AUTH_JWT_SECRET en los secretos del repositorio."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Actualizar satélite y clima
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_JWT_SECRET: ${{ secrets.AUTH_JWT_SECRET }}
          COPERNICUS_CLIENT_ID: ${{ secrets.COPERNICUS_CLIENT_ID }}
          COPERNICUS_CLIENT_SECRET: ${{ secrets.COPERNICUS_CLIENT_SECRET }}
          ACTUALIZAR_MAX_LOTES: '40'
          ACTUALIZAR_MAX_LOTES_CLIMA: '160'
        run: npm run actualizar
